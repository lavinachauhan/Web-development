<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Transforms</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        width: 100%;
        height: 100%;
    }
    .container{
        background-color: antiquewhite;
        padding: 5rem;
        gap: 1rem;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
    }
    .item{
        height: 250px;
        width: 250px;
        border: 2px solid black;
        background-color: rgb(3, 3, 223);
        padding: 2rem;
        color: white
    }

    #RotateX:hover{
        transform: RotateX(45deg);
    }
   #RotateY:hover{
        transform: RotateY(45deg);
    }
    #RotateZ:hover{
        transform: RotateZ(45deg);
    }
    #TranslateX:hover{
        transform: translateX(-300px);
    }
    #TranslateY:hover{
        transform: translateY(-100px);
    }
    #TranslateZ:hover{
        transform:perspective(300px) translateZ(100px);
    }
    #ScaleX:hover{
        transform: ScaleX(1.5);
    }
    #ScaleY:hover{
        /* transform: ScaleY(1.5); */
        transform: skewY(30deg)
    }
    #ScaleZ:hover{
        transform:perspective(300px) ScaleZ(2) RotateY(45deg);;
    }
</style>
<body>
    <div class="container">
        <div class="item" id = "RotateX">RotateX</div>
        <div class="item" id = "RotateY">RotateY</div>
        <div class="item" id = "RotateZ">RotateZ</div>
        <div class="item" id = "TranslateX">TranslateX</div>
        <div class="item" id = "TranslateY">TranslateY</div>
        <div class="item" id = "TranslateZ">TranslateZ</div>
        <div class="item" id = "ScaleX">ScaleX</div>
        <div class="item" id = "ScaleY">ScaleY</div>
        <div class="item" id = "ScaleZ">ScaleZ</div>
    </div>
    
</body>
</html>
