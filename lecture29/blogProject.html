<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class = "bodyContainer">
    <div class ="container">

        <header class = "header_container">
            <h1 class = "header_title">
                Coding Platform Blogs
            </h1>
            <p class = "header_desc">
                Utilize this space to incorporate a 
                captivating subheading crafted by ChatGPT, 
                adding depth and intrique to your blog
            </p>
        </header>
        <main class = "main_container">
            <!-- card 1 starts here -->
             <div class="card_container ">
                <a href="#" class = "card_image_container">
                    <img src="https://source.unsplash.com/random/600×400?healthy " alt="card 1 image" 
                    class = "card_image" loading = "lazy">
                </a>

                <div class="card_title_container">
                    <a href="#">
                        <h2>
                            New Gadgets Released
                        </h2>
                    </a>
                    <p class = "card_desc">
                        Check out the latest hitting the 
                        market, from smartphones to smartphones
                    </p>
                </div>
                <footer class = "card_footer_container">
                    <div class="author_container">
                        <div class="author_avatar_container">
                            <img src="https://api.dicebear.com/7.x/notionists/svg?seed=John?size=64"
                            loading = "lazy" class = "author_avatar"
                            alt = "avatar 1">
                            <div class="author_info_container">
                                <span>
                                    John Doe
                                </span>
                                <span>
                                    Sept 19, 2025
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="card_tag_container">
                        <span>Technology</span>

                    </div>

                </footer>

             </div>
            <!-- card 1 ends here -->
        </main>

    </div>
    
</body>
</html>
