<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin :0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            width : 100vw;
            height: 100vh;
            border: 5px solid black;
            background-color: beige;
        }

        .box{
            width: 350px;
            height: 80px;
            background-color: blue;
            border-radius: 10px;
            margin: 10px;
            position:relative;
            border: 3px solid yellow;
            animation-name: rightmovement;
            animation-duration: 5s;
            animation-iteration-count: 1;
            animation-timing-function: linear;
            /* animation-delay: 1s; */
            /* animation-timing-function: cubic-bezier(0.1, 0.7, 0.1, 0.6); */
            /* animation-direction: alternate; */
            animation-fill-mode: both; 
        }

        @keyframes rightmovement{
            /* initial state */
            from{
                top : 0;
                left: 0;
            }
            /* destination state */
            to{
                top : 0;
                left: 1000px;
            }
        }

        #box2{
                height:40px;
                width:300px;
                border: 2px solid black;
                background-color: aquamarine;
                border-radius: 3px;
                margin:10px;
                padding: 10px;
                position :relative;
                animation: 5s ease-in 1s infinite alternate none running leftmovement;
        }

        @keyframes leftmovement{
            from{
                top: 300px;
                left: 1050px;
            }
            to{
                top: 300px;
                left: 0;
            }
        }

        #circle{
            width: 90px;
            height: 90px;
            background-color: blue;
            border: 3px solid yellow;
            border-radius: 100px;
            margin: 10px;
            position: relative;
            top :100px;
            left: 650px;
            animation: 10s ease-in-out 0s  infinite alternate-reverse none running circlemovement;
        }

        
        @keyframes circlemovement{
            0%{
                top: 1%;
                left: 5%;
            }
            30%{
                top: 5%;
                left: 10%;
            }
            60%{
                top:60%;
                left:80%;
            }
            100%{
                top: 65%;
                left: 60%;
            }
        }
       
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>

        <div id="box2"></div>
        <div id="circle"></div>
    </div>
</body>
</html>
