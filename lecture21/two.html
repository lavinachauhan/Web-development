<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border : 1px solid black;
            background-color: bisque;
            display: flex;
            flex-direction: row;
            width : 400px;
            margin:10px;
            padding: 10px;
        }
        #leftbox{
            background-color: aquamarine;
            border :1px solid blue;
            width: 47%;
            margin:3px;
            padding: 2px;
            display: flex;
        }
        #rightbox{
            background-color: red;
            border :1px solid brown;
            width: 47%;
            margin:3px;
            padding: 2px;
        }
        img{
            width : 170px;
        }

        @media (max-width : 640px){
            .container{
                flex-direction: column;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div id ="leftbox">
            <p>text 1</p>
            <p>text 2</p>
        </div>
        <div id ="rightbox">
            <img src="butterfly1.jpg">
        </div>
    </div>
</body>
</html>
